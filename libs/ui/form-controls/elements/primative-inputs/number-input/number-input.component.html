<label class="inputShell">

    <h5 class="inputLabel" [ngStyle]="{ '--labelFontSize' : LabelFontSize }" *ngIf="Label">{{Label}}</h5>

    <input
      class="inputField"
      [ngStyle]="{ '--width' : InputSize, '--fontSize' : FontSize }"
      type="text"
      [formControl]="Control"
      (input)="handleZero()"
    />

</label>
