<section class="mainContainer">
  <!--<label>
    <h6 *ngIf="Label">{{ Label }}</h6>

    <input [(ngModel)]="Control.value" hidden="true" />
  </label>-->
  @for ( a of OptionList; track $index ) {

    <button
      type="button"
      class="selectButton"
      [ngClass]="{'active' : Control.value === a, 'inactive' : Control.value !== a }"
      (click)="updateValue( a )"
    >
      {{ a }}
    </button>
  }

</section>
