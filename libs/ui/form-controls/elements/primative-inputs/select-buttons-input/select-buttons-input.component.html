<section class="mainContainer" [ngStyle]="{'--buttonWidth' : ButtonWidth}">
 
  @for ( a of OptionList; track $index ) {

    <button
      type="button"
      class="selectButton"
      [ngStyle]="{ '--fontSize' : FontSize }"
      [ngClass]="{ 'active' : Control.value === a, 'inactive' : Control.value !== a }"
      (click)="updateValue( a )"
    >
      {{ a }}
    </button>
  }

</section>
