<section class="mainContainer" [formGroup]="Control">
  
  <lib-text-input
    ngDefaultControl
    [formControlName]="'name'"
    [Control]="Control.controls.name"
    [label]="'name'"
  />

  <lib-weight-measurement-group
    ngDefaultControl
    [formGroupName]="'servingSize'"
    [Control]="Control.controls.servingSize"
    [Label]="'serving size'"
  />
  
  <lib-weight-measurement-group
    ngDefaultControl
    [formGroupName]="'amount'"
    [Control]="Control.controls.amount"
    [Label]="'amount'"
  />

</section>
