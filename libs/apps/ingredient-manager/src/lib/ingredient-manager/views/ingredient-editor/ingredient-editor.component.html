<form class="mainContainer" [formGroup]="IngredientEditorForm" (ngSubmit)="$event.preventDefault()">

    <section class="propInfoContainer">



        @if ( !EditNameToggle ) {


            <article class="propertyDisplayContainer">

                <h1 class="nameText">{{IngredientEditorForm.value.name}}</h1>

                <!-- Needs Pencil Icon -->
                <button class="editButton" type="button" (click)="openNameControl()">edit</button>

            </article>


        }
        @else {


            <article class="textControlContainer">



                <lib-text-input
                    ngDefaultControl
                    [Control]="IngredientEditorForm.controls.name"
                    [formControlName]="'name'"
                    [InputSize]="33"
                    [FontSize]="'var(--text-title-1)'"
                    [TextAlign]="'center'"
                />



                <article class="controlButtonContainer">


                    <button
                        type="button"
                        class="controlButton"
                        (click)="closeNameControl( true )"
                    >
                        save
                    </button>



                    <button
                        type="button"
                        class="controlButton"
                        (click)="closeNameControl( false )"
                    >
                        cancel
                    </button>


                </article>


            </article>


        }

    </section>



    <section class="propInfoContainer">

        @if ( !EditBrandToggle ) {

            <h4 class="brandTitle">brand</h4>

            <article class="propertyDisplayContainer">

                <h2 class="brandText">{{ IngredientEditorForm.value.brand }}</h2>

                <button type="button" class="editButton" (click)="openBrandControl()">edit</button>
                
            </article>

        }

        @else {

            <article class="textControlContainer">

                <lib-text-input
                    ngDefaultControl
                    [Control]="IngredientEditorForm.controls.brand"
                    [formControlName]="'brand'"
                    [FontSize]="'var(--text-subtitle-3)'"
                    [InputSize]="33"
                    [TextAlign]="'center'"
                />



                <article class="controlButtonContainer">

                    <button
                        type="button"
                        class="controlButton"
                        (click)="closeBrandControl( true )"
                    >
                        save
                    </button>
    
    
    
                    <button
                        type="button"
                        class="controlButton"
                        (click)="closeBrandControl( false )"
                    >
                        cancel
                    </button>
                    
                </article>


            </article>
        }

    </section>



    <section class="optionalGroupInfoContainer">

        <h2 class="brandTitle">nutrition facts</h2>

        @if ( !IngredientEditorForm.controls.nutrition ) {

            <button
            class="controlButton"
            type="button"
            (click)="addNutritionFacts()"
            >
                add
            </button>
        }

        @else {

            <lib-nutrition-group
                ngDefaultControl
                [formGroupName]="'nutrition'"
                [Control]="IngredientEditorForm.controls.nutrition"
            />

        }
    </section>
