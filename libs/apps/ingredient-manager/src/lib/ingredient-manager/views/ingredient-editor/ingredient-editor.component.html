<form class="mainContainer" [formGroup]="IngredientEditorForm" (ngSubmit)="$event.preventDefault(); handleSubmission();">

    <lib-text-input
        [label]="'name'"
        ngDefaultControl
        [Control]="IngredientEditorForm.controls.name"
        [formControlName]="'name'"
        [InputSize]="44"
    />
    
    <lib-text-input
        [label]="'brand'"
        ngDefaultControl
        [Control]="IngredientEditorForm.controls.brand"
        [formControlName]="'brand'"
        [InputSize]="44"
    />

    @if ( NotesToggle ) {

        <lib-note-list
            [Control]="IngredientEditorForm.controls.notes!"
            ngDefaultControl
            [formGroupName]="'notes'"
        />
    }



    @if ( ProfileTypeToggle ) {

        <lib-text-input
            [Control]="IngredientEditorForm.controls.profileType!"
            ngDefaultControl
            [formControlName]="'profileType'"
            [label]="'profile type'"
            [InputSize]="33"
        />
        
        @if ( IngredientEditorForm.controls.data ) {
    
            <lib-ingredient-profile-manager
                ngDefaultControl
                [Control]="IngredientEditorForm.controls.data"
                [ProfileType]="IngredientEditorForm.value.profileType!"
                [formGroupName]="'data'"
            />
        }
    }






    @if (IngredientEditorForm.controls.nutrition) {
        
        <lib-nutrition-group
            ngDefaultControl
            [formGroup]="IngredientEditorForm.controls.nutrition"
            [Control]="IngredientEditorForm.controls.nutrition"
        />

    }

    <lib-location-list
        ngDefaultControl
        [Control]="IngredientEditorForm.controls.locations"
        [Label]="'locations'"
    />

    <button type="submit">save</button>


</form>
