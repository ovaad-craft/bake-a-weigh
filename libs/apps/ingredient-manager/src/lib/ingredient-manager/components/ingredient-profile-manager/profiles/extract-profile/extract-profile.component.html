<section class="mainContainer" [formGroup]="Control">
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [OptionType]="ExtractTypeSelection"
    [OptionList]="[ 'water', 'alcohol', 'oil' ]"
    [Label]="'type'"
  />
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.state"
    [OptionType]="ExtractStateSelection"
    [OptionList]="[ 'liquid', 'paste' ]"
    [Label]="'type'"
  />

</section>
