<section class="mainContainer" [formGroup]="Control">
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [OptionType]="YogurtSelectionType"
    [OptionList]="[ 'plain', 'flavored' ]"
    [Label]="'type'"
  />

  @if ( Control.controls.flavor !== undefined ) {

    <lib-text-input
      ngDefaultControl
      [Control]="Control.controls.flavor"
      [label]="'flavor'"
    />

  }

</section>
