<section class="mainContainer" [formGroup]="Control">
  
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [Label]="'type'"
    [OptionType]="SugarTypeOptions"
    [OptionList]="[ 'cane', 'coconut', 'palm', 'other' ]"
  />

  <lib-text-input
    ngDefaultControl
    [Control]="Control.controls.infoType"
    [label]="'infoType'"
  />

  <lib-text-input
    ngDefaultControl
    [Control]="Control.controls.source"
    [label]="'source'"
  />

</section>
