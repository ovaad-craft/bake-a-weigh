<section class="mainContainer" [formGroup]="Control">

  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [Label]="'type'"
    [OptionType]="'DairyType'"
    [OptionList]="[ 'cow', 'goat' ]"
  />

  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.form"
    [Label]="'form'"
    [OptionType]="'DairyForm'"
    [OptionList]="[ 'milk', 'cream', 'yogurt', 'butter', 'cheese' ]"
  />

  <lib-toggle-input
    ngDefaultControl
    [Control]="Control.controls.pasturized"
    [Label]="'pasturized'"
  />
  
  <lib-toggle-input
    ngDefaultControl
    [Control]="Control.controls.homogenized"
    [Label]="'homogenized'"
  />

  <p>{{ Control.value | json }}</p>
</section>
