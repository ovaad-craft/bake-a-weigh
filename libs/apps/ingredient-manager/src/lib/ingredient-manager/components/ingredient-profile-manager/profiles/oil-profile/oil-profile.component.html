<section class="mainContainer" [formGroup]="Control">

  <lib-text-input
    ngDefaultControl
    [formControlName]="'type'"
    [Control]="Control.controls.type"
    [label]="'type'"
  />

  <lib-select-input
    ngDefaultControl
    [formControlName]="'state'"
    [Control]="Control.controls.state"
    [OptionType]="OilStateSelection"
    [OptionList]="[ 'liquid', 'solid' ]"
    [Label]="'state'"
  />

</section>
