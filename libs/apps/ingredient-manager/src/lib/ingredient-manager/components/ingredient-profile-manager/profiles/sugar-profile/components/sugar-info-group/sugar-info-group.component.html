<section class="mainContainer" [formGroup]="Control">
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.consistency"
    [OptionType]="SugarConsistencyOptions"
    [OptionList]="[ 'cane', 'coconut', 'palm', 'other' ]"
    [Label]="'consistency'"
  />
  
  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [OptionType]="SugarTypeOptions"
    [OptionList]="[ 'white', 'light brown', 'dark brown', 'raw' ]"
    [Label]="'type'"
  />

</section>
