<section class="mainContainer" [formGroup]="Control">
  
  <lib-text-input
    ngDefaultControl
    [formControlName]="'species'"
    [Control]="Control.controls.species"
    [label]="'species'"
  />

  <lib-toggle-input
    ngDefaultControl
    [formControlName]="'roasted'"
    [Control]="Control.controls.roasted"
    [Label]="'roasted'"
  />
  
  <lib-toggle-input
    ngDefaultControl
    [formControlName]="'salted'"
    [Control]="Control.controls.salted"
    [Label]="'salted'"
  />

</section>
