<section class="mainContainer" [formGroup]="Control">
  
  <lib-text-input
    ngDefaultControl
    [Control]="Control.controls.type"
    [label]="'type'"
  />

  <lib-select-input
    ngDefaultControl
    [Control]="Control.controls.form"
    [OptionType]="SweetenerFormOptions"
    [OptionList]="[ 'liquid', 'powder', 'crystal', 'block', 'paste' ]"
    [Label]="'form'"
  />
</section>
