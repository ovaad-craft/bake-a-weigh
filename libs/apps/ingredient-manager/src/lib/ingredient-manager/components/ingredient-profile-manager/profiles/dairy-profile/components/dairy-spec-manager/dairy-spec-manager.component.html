<section class="mainContainer">

  @switch ( ControlType ) {

    @case ( 'milk' ) {

      <lib-milk-specs
        ngDefaultControl
        [Control]="getMilkSpecs()"
        [Label]="'details'"
      />

    }

    @case ( 'cream' ) {

      <lib-cream-specs
        ngDefaultControl
        [Control]="getCreamSpecs()"
        [Label]="'specs'"
      />

    }

    @case ( 'yogurt' ) {

      <lib-yogurt-specs
        ngDefaultControl
        [Control]="getYogurtSpecs()"
        [Label]="'specs'"
      />

    }

    @case ( 'butter' ) {

      <lib-butter-specs
        ngDefaultControl
        [Control]="getButterSpecs()"
        [Label]="'specs'"
      />

    }

    @case ( 'cheese' ) {

      <lib-cheese-specs
        ngDefaultControl
        [Control]="getCheeseSpecs()"
        [Label]="'specs'"
      />

    }

  }

  <p>{{ Control.value | json }}</p>
</section>
