<section class="mainContainer" [formGroup]="Control">

<lib-text-input
  ngDefaultControl
  [Control]="Control.controls.kind"
  [label]="'kind'"
/>

<lib-select-input
  ngDefaultControl
  [Control]="Control.controls.texture"
  [OptionType]="TextureSelect"
  [OptionList]="[ 'smooth/creamy', 'smooth/chunky', 'crumbly', 'solid' ]"
  [Label]="'texture'"
/>

<lib-select-input
  ngDefaultControl
  [Control]="Control.controls.hydration"
  [OptionType]="TextureSelect"
  [OptionList]="[ 'very wet', 'wet', 'damp', 'dry', 'very dry' ]"
  [Label]="'hydration'"
/>

<lib-select-input
  ngDefaultControl
  [Control]="Control.controls.state"
  [OptionType]="TextureSelect"
  [OptionList]="[ 'spreadable', 'shredded', 'crumbled', 'block', 'ball', 'sliced' ]"
  [Label]="'state'"
/>

</section>
