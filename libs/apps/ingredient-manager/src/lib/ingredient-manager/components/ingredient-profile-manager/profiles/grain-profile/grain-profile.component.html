<section class="mainContainer" [formGroup]="Control">

  @if ( Control.controls.protein) {

    <lib-nutrient-tracker
      ngDefaultControl
      [formGroupName]="'protein'"
      [Control]="Control.controls.protein"
      [Label]="'protein'"
    />

  }

  @if ( Control.controls.maxObsorption ) {

    <lib-number-input
      ngDefaultControl
      [formControlName]="'maxObsorption'"
      [Control]="Control.controls.maxObsorption"
      [Label]="'max obsorption'"
    />

  }
  
</section>
