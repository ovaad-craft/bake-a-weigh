<section class="mainContainer" [formGroup]="Control">



    @if ( !ServingAndCalorieControlToggle ) {
        
        <article class="servingAndCalorieContainer">
            
            
            
            <button
                type="button"
                class="editButton"
                (click)="openServingAndCalorieControl()"
            >
                edit
            </button>
        
            <article class="servingAndCalorieGrid">
                
                <article class="propInfoContainer">

                    
                    <h5 class="servingSizeDisplayText">
                        {{Control.value.servingSize!.amount}}{{Control.value.servingSize!.weightType}}
                    </h5>
                    
                    <h4 class="propInfoTitle">serving size</h4>


                </article>


        
                <article class="propInfoContainer">
    
                    
                    <h5 class="servingSizeDisplayText">
                        {{Control.value.calories}}
                    </h5>
                    
                    <h4 class="propInfoTitle">calories</h4>
    
    
                </article>
                
            </article>
            
            
        </article>

    }

    @else {

        <article class="servingAndCalorieControlContainer">

            <article class="servingContainer">
    
                <lib-serving-size
                    ngDefaultControl
                    [formGroupName]="'servingSize'"
                    [Control]="Control.controls.servingSize"
                />
    
            </article>
    
            <article class="calorieContainer">
    
                <lib-number-input
                    ngDefaultControl
                    [formControlName]="'calories'"
                    [Control]="Control.controls.calories"
                    [Label]="'calories'"
                    [LabelFontSize]="'var( --text-article-2 )'"
                    [InputSize]="5"
                    [FontSize]="'var( --text-title-3 )'"
                />
    
            </article>

            <article class="controlButtonContainer">

                <button
                        type="button"
                        class="editButton"
                        (click)="closeServingAndCalorieControl( true )"
                    >
                        save
                    </button>
    
    
    
                    <button
                        type="button"
                        class="controlButton"
                        (click)="closeServingAndCalorieControl( false )"
                    >
                        cancel
                    </button>

            </article>

        </article>

    }

    <article class="nutrientContainer">
        
        
        @if( TotalFatToggle ){
            
            <article class="controlContainer">
                
                <lib-nutrient-category
                    ngDefaultControl
                    [formGroupName]="'totalFat'"
                    [Control]="Control.controls.totalFat!"
                    [Name]="'Total Fat'"
                    [NameEnabled]="false"
                />
                
                <button type="button" class="controlButton" (click)="removeGroup('totalFat')">delete</button>
                
            </article>
            
            
        }
        @else {
            
            <h4 class="propInfotitle">Total Fat</h4>
            <button class="controlButton" type="button" (click)="addGroup('totalFat')">add</button>

        }

    </article>


    
    
    <!--<lib-serving-size
        ngDefaultControl
        [formGroupName]="'servingSize'"
        [Control]="Control.controls.servingSize"
    />

    <lib-number-input
        ngDefaultControl
        [formControlName]="'calories'"
        [Control]="Control.controls.calories"
        [Label]="'calories'"
        [InputSize]="5"
    />

    <article class="nutrientContainer">
        
        <h5>Total Fat</h5>

        @if( TotalFatToggle ){

            <article class="controlContainer">

                <lib-nutrient-category
                    ngDefaultControl
                    [formGroupName]="'totalFat'"
                    [Control]="Control.controls.totalFat!"
                    [NameEnabled]="false"
                />

                <button type="button" (click)="removeGroup('totalFat')">delete</button>

            </article>
    
    
        }
        @else {

            <button type="button" (click)="addGroup('totalFat')">add</button>

        }

    </article>

    
    
    <article class="nutrientContainer">

        <h5>Cholesterol</h5>

        
        @if( CholesterolToggle ){
            
            <article class="controlContainer">
    
                <lib-nutrient-category
                    [Control]="Control.controls.cholesterol!"
                    [NameEnabled]="false"
                    ngDefaultControl
                    [formGroupName]="'cholesterol'"
                />

                <button type="button" (click)="removeGroup('cholesterol')">delete cholesterol</button>

            </article>
    
    
        }
        @else {

            <button type="button" (click)="addGroup('cholesterol')">add cholesterol</button>

        }

    </article>


    
    <article class="nutrientContainer">

        <h5>Sodium</h5>

        @if( SodiumToggle ){
    
            <article class="controlContainer">

                <lib-nutrient-category
                    [Control]="Control.controls.sodium!"
                    [NameEnabled]="false"
                    ngDefaultControl
                    [formGroupName]="'sodium'"
                />

                <button type="button" (click)="removeGroup('sodium')">delete sodium</button>

            </article>
    
        }
        @else {

            <button type="button" (click)="addGroup('sodium')">add sodium</button>

        }

    </article>



    <article class="nutrientContainer">

        <h5>Total Carbohydrates</h5>

        
        @if( TotalCarbohydratesToggle ){
            
            <article class="controlContainer">
    
                <lib-nutrient-category
                    [Control]="Control.controls.totalCarbohydrates!"
                    [NameEnabled]="false"
                    ngDefaultControl
                    [formGroupName]="'totalCarbohydrates'"
                />

                <button type="button" (click)="removeGroup('totalCarbohydrates')">delete carbs</button>
    
            </article>    
    
        }
        @else {

            <button type="button" (click)="addGroup('totalCarbohydrates')">add carbs</button>

        }

    </article>



    <article class="nutrientContainer">

        <h5>Protein</h5>

        @if( ProteinToggle ){

            <article class="controlContainer">

                <lib-nutrient-category
                    [Control]="Control.controls.protein!"
                    [NameEnabled]="false"
                    ngDefaultControl
                    [formGroupName]="'protein'"
                />

                <button type="button" (click)="removeGroup('protein')">delete protein</button>

            </article>    
    
        }
        @else {

            <button type="button" (click)="addGroup('protein')">add protein</button>

        }

    </article>


    
    @if (Control.controls.vitaminsAndMinerals) {

        <article class="controlContainer">

            <lib-vitamins-and-minerals-list
                [Control]="Control.controls.vitaminsAndMinerals"
                ngDefaultControl
                [formGroupName]="'vitaminsAndMinerals'"
            />

            <button type="button" (click)="removeVitamins()">delete vitamins</button>

        </article>

    }
    @else {

        <button type="button" (click)="addVitamins()">add vitamins</button>

    }


    <lib-ingredient-list
        [Control]="Control.controls.ingredients"

    /> -->

</section>
