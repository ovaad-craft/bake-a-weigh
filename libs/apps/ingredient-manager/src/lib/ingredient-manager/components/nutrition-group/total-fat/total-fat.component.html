<section class="mainContainer" [formGroup]="Control">
  
  @if( !ControlToggle ){

    <article class="displayContainer">

        <h5 class="amountDisplay">

            Total Fat
            {{ Control.value.totalAmount?.amount }}{{ Control.value.totalAmount?.weightType }}
            <span *ngIf="Control.value.totalAmount?.percentage !== undefined">  {{ Control.value.totalAmount?.percentage }}%</span>
            
        </h5>

        <button type="button" class="editButton" (click)="toggleControlOn()">edit</button>

    </article>

  }

  @else {

    <article class="controlContainer">

      <h5 class="amountDisplay">Total Fat</h5>
      
      <lib-weight
        ngDefaultControl
        [Control]="Control.controls.totalAmount"
        [formGroupName]="'totalAmount'"
        class="weightComponent"
      />

      <article class="controlButtonContainer">

        <button
          type="button"
          class="controlButton"
          (click)="toggleControlOff( true )"
        >
          save
        </button>



        <button
          type="button"
          class="controlButton"
          (click)="toggleControlOff( false )"
        >
          cancel
        </button>

      </article>

    </article>

  }



  <article class="fatTypesContainer">

    <article class="fatContainer">
  
      @if ( !Control.controls.saturatedFat ) {
        <article class="addFatContainer">

          <h4 class="fatTypeTitle">Saturated Fat</h4>
          <button class="addButton" type="button" (click)="addFatType( 'saturated' )">add</button>

        </article>
      }
  
    </article>

  </article>



</section>
