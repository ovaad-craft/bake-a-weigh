<section class="mainContainer" [formGroup]="Control">

    <article class="controlContainer">
        
        <article class="amountContainer">

            <lib-number-input
                ngDefaultControl
                [Control]="Control.controls.amount"
                [formControlName]="'amount'"
                [InputSize]="4"
                [FontSize]="'var( --text-title-3 )'"
            />
            
            <h3 class="weightSelectionDisplay">{{ Control.value.weightType }}</h3>
            
        </article>
        
        <lib-select-buttons-input
            ngDefaultControl
            [Control]="Control.controls.weightType"
            [formControlName]="'weightType'"
            [OptionList]="WeightOptions"
            [FontSize]="'var( --text-article-2 )'"
            [Label]="'weight'"
            class="selectContainer"
        />

    </article>
