<section class="mainContainer" [formGroup]="Control">

    <h5>notes</h5>



    <article class="noteListContainer" [formArrayName]="'list'">

        @for ( a of Control.controls.list.controls; track $index ) {

            <lib-note
                [Control]="a"
                ngDefaultControl
                [formGroupName]="$index"
            />

            <button type="button" (click)="deleteNote($index)">delete</button>
            
            
        }
        
        <button type="button" (click)="addNote()">delete</button>

    </article>




</section>
